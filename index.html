<style>
/* Layout: one calm column. A day in an Indian life, played one decision at a time; cream paper, rust doing the talking. */
:root {
  --cream: #F5EBDF;
  --rust: #C04E2A;
  --ink: #351D1D;
  --clay: #B58777;
  --clay-text: #8A5A4A;
  --blush: #E6CBBD;
  --paper: #F8F2EB;
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Print", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--cream); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.55;
  padding-block: 12px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mark { font-family: var(--serif); font-size: 30px; line-height: 1; color: var(--rust); letter-spacing: -0.01em; }
.topr { display: flex; align-items: center; gap: 12px; }
.count { font-size: 13px; color: var(--clay-text); font-variant-numeric: tabular-nums; }
.lang { font: inherit; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--blush); background: var(--paper); color: var(--ink); cursor: pointer; }
.lang:hover { border-color: var(--rust); }
.bar { height: 3px; background: var(--blush); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--rust); transition: width .4s ease; }

h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 em, h2 em, h3 em { color: var(--rust); font-style: italic; }
h1 { font-size: clamp(40px, 12vw, 54px); line-height: 1.0; }
h2 { font-size: clamp(32px, 9vw, 40px); line-height: 1.05; }
h3 { font-size: 30px; line-height: 1.08; }
p { margin: 0; text-wrap: pretty; }
.small { font-size: 13px; color: var(--clay-text); }
.center { text-align: center; }
.hand { font-family: var(--hand); font-size: 26px; line-height: 1.05; color: var(--rust); }
.label { font-size: 12px; letter-spacing: 0.08em; color: var(--clay-text); font-weight: 500; }

.screen { display: flex; flex-direction: column; gap: 18px; animation: rise .35s ease both; min-width: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* hook */
.hookrow { display: flex; align-items: center; gap: 14px; }
.clk { width: 92px; height: 92px; flex: none; }
.clk .face { fill: var(--paper); stroke: var(--blush); stroke-width: 2; }
.clk .tick { stroke: var(--clay); stroke-width: 2; stroke-linecap: round; }
.clk .hh { stroke: var(--rust); stroke-width: 5; stroke-linecap: round; transform-origin: 60px 60px; animation: hour 1.5s cubic-bezier(.2,.8,.2,1) .15s both; }
.clk .mm { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.clk .dot { fill: var(--ink); }
.clk .ring { fill: none; stroke: var(--rust); stroke-width: 2; opacity: 0; transform-origin: 60px 60px; animation: ping 2.6s ease-out 1.6s infinite; }
@keyframes hour { from { transform: rotate(-120deg); } to { transform: rotate(120deg); } }
@keyframes ping { 0% { transform: scale(.9); opacity: .5; } 100% { transform: scale(1.12); opacity: 0; } }
.scene { font-family: var(--serif); font-style: italic; font-size: 26px; line-height: 1.1; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font: inherit; cursor: pointer; padding: 13px 18px; border-radius: 999px; border: 1.5px solid var(--blush); background: var(--paper); color: var(--ink); font-size: 16px; font-weight: 500; transition: all .15s; }
.chip:hover { border-color: var(--rust); background: #fff7ee; }
.chip[aria-pressed="true"] { background: var(--rust); border-color: var(--rust); color: #FFF8F0; }
.chips.big .chip { flex: 1 1 calc(50% - 10px); text-align: center; padding: 18px 12px; font-family: var(--serif); font-size: 24px; font-weight: 400; border-radius: 16px; }

/* swipe card */
.stack { position: relative; padding: 0 0 10px; }
.stack::before { content: ""; position: absolute; inset: 10px 10px 0; border: 1px solid var(--blush); border-radius: 22px; background: var(--paper); opacity: .7; }
.swipe { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; background: var(--paper); border: 1px solid var(--blush); border-radius: 22px; padding: 34px 22px 26px; min-height: 230px; display: flex; flex-direction: column; justify-content: center; gap: 10px; box-shadow: 0 14px 34px -22px rgba(53,29,29,.5); transition: transform .25s ease, opacity .25s ease; }
.swipe .q { font-family: var(--serif); font-size: 31px; line-height: 1.1; text-wrap: balance; }
.stamp { position: absolute; top: 14px; font-family: var(--serif); font-style: italic; font-size: 24px; padding: 2px 12px; border: 2px solid currentColor; border-radius: 10px; opacity: 0; pointer-events: none; }
.stamp.l { left: 14px; color: var(--rust); transform: rotate(-8deg); opacity: var(--l, 0); }
.stamp.r { right: 14px; color: var(--ink); transform: rotate(8deg); opacity: var(--r, 0); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { font: inherit; cursor: pointer; padding: 16px 12px; border-radius: 16px; border: 1.5px solid var(--blush); background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 26px; line-height: 1; transition: border-color .15s, background .15s, transform .1s; }
.choice em { color: var(--rust); }
.choice:hover { border-color: var(--rust); background: #fff7ee; }
.choice:active { transform: scale(.98); }

.btn { font: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 16px 22px; border-radius: 999px; border: 1.5px solid var(--rust); background: var(--rust); color: #FFF8F0; font-weight: 700; font-size: 16px; text-decoration: none; text-align: center; transition: background .15s, transform .1s; }
.btn:hover { background: #a94323; }
.btn:active { transform: scale(.985); }
.btn.ghost { background: transparent; color: var(--rust); }
.btn.ghost:hover { background: var(--blush); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 10px; }

.claim { background: var(--paper); border: 1px solid var(--blush); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.claim .q { font-family: var(--serif); font-size: 26px; line-height: 1.1; }
.reveal { background: var(--paper); border: 1px solid var(--blush); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.you { font-size: 14px; color: var(--clay-text); }
.sources { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--clay-text); border-top: 1px solid var(--blush); padding-top: 12px; }
.sources a, .foot a { color: var(--rust); overflow-wrap: anywhere; }

/* slider */
.gv { font-family: var(--serif); font-size: 84px; line-height: .9; color: var(--rust); font-variant-numeric: tabular-nums; }
.range { width: 100%; accent-color: var(--rust); height: 36px; margin: 0; }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--clay-text); }
.track { position: relative; height: 10px; border-radius: 6px; background: var(--blush); margin: 26px 6px 30px; }
.track .m { position: absolute; top: -6px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; border: 3px solid var(--paper); }
.track .m.g { background: var(--ink); }
.track .m.t { background: var(--rust); }
.track .tag { position: absolute; top: 22px; transform: translateX(-50%); font-size: 12px; white-space: nowrap; color: var(--clay-text); }
.track .tag.t { color: var(--rust); font-weight: 700; }
.track .tag.g { top: -30px; }

/* numbers tool */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--clay-text); font-weight: 500; }
.field input[type="number"], .field input[type="text"], .field input[type="tel"] { font: inherit; font-size: 18px; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--blush); background: #fffaf4; color: var(--ink); width: 100%; min-width: 0; }
.field input:focus-visible { border-color: var(--rust); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.res { background: var(--paper); border-left: 3px solid var(--rust); border-radius: 4px 14px 14px 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }

/* wrapped card */
.wrapped { background: var(--paper); border: 1px solid var(--blush); border-radius: 24px; padding: 26px 22px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 18px 40px -26px rgba(53,29,29,.55); }
.wrapped .wtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wrapped .arch { font-family: var(--serif); font-size: clamp(40px, 12vw, 52px); line-height: .98; color: var(--rust); font-style: italic; }
.wrapped .line { font-size: 15px; }
.wrapped .big { display: flex; align-items: baseline; gap: 10px; border-top: 1px solid var(--blush); padding-top: 14px; }
.wrapped .big b { font-family: var(--serif); font-weight: 400; font-size: 76px; line-height: .9; color: var(--ink); font-variant-numeric: tabular-nums; }
.wrapped .big span { font-family: var(--serif); font-style: italic; font-size: 24px; }
.wrows { display: flex; flex-direction: column; }
.wrows div { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px dashed var(--blush); font-size: 14px; }
.wrows div span:first-child { color: var(--clay-text); flex: none; }
.wrows div span:last-child { text-align: right; font-weight: 500; }
.wfoot { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--clay-text); }
.wfoot .mark { font-size: 26px; }

.note { background: var(--paper); border: 1px solid var(--blush); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.note h3 { font-size: 26px; }
.ask { border-left: 2px solid var(--rust); padding-left: 12px; font-size: 15px; }
.ask i { display: block; font-style: normal; font-size: 12px; letter-spacing: 0.08em; color: var(--clay-text); margin-bottom: 2px; }
.list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 12px; align-items: baseline; font-size: 15px; }
.list li .v { flex: none; font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--rust); width: 52px; }

.cta { background: var(--ink); color: var(--cream); border-radius: 22px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.cta h2 em { color: #F0A98C; }
.cta .small, .cta .label { color: #D9BDAF; }
.cta .btn { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.cta .btn:hover { background: var(--blush); }
.cta .btn.ghost { background: transparent; color: var(--cream); border-color: #8a6a60; }
.cta .btn.ghost:hover { background: #4a2e2e; }
.cta .field label { color: #D9BDAF; }
.cta .field input { background: #4a2e2e; border-color: #6a4a42; color: var(--cream); }
.cta .field input::placeholder { color: #a98c80; }
.cta .field input:focus-visible { outline-color: var(--cream); border-color: #F0A98C; }
.cta :focus-visible { outline-color: var(--cream); }
.seen { background: #432727; border: 1px dashed #7a5a50; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.seen div { display: flex; gap: 10px; justify-content: space-between; }
.seen div span:first-child { color: #D9BDAF; flex: none; }
.seen div span:last-child { text-align: right; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #D9BDAF; }
.consent input { margin-top: 3px; accent-color: #F0A98C; width: 18px; height: 18px; flex: none; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .row, .grid2 { grid-template-columns: 1fr; } }
.toast { font-size: 14px; min-height: 1.2em; color: #F0A98C; }
.toast.ok { color: #BFE3B4; }
.foot { font-size: 12px; color: var(--clay-text); display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .screen, .clk .hh, .clk .ring { animation: none; } .bar > i, .swipe { transition: none; } }
</style>

<main class="app" id="app"></main>

<script>
(function () {
  "use strict";

  /* ---------- content (English + Hinglish) ---------- */
  var SRC = {
    ext: ["Wilding et al., Diabetes Obes Metab 2022 (trial extension)", "https://pmc.ncbi.nlm.nih.gov/articles/9542252"],
    annals: ["Moiz et al., Annals of Internal Medicine 2025", "https://pubmed.ncbi.nlm.nih.gov/39761578/"],
    summary: ["2 Minute Medicine summary of the 2025 Annals review", "https://2minutemedicine.com/glucagon-like-peptide-1-receptor-agonists-and-co-agonists-safe-and-effective-for-weight-loss"],
    nausea: ["Tolerability of nausea and vomiting in a randomised trial, PMC", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4010971"],
    sa: ["Obesity and Dyslipidemia in South Asians, PMC", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3738996"],
    dexa: ["ENDO 2021 DEXA substudy, reported by Patient Care", "https://www.patientcareonline.com/view/semaglutide-2-4-mg-reduces-visceral-adiposity-improves-lean-body-mass-to-fat-mass-ratio"]
  };

  var CARDS = {
    hunger: { kind: "swipe", answer: "myth", src: [SRC.ext, SRC.summary],
      claim: { en: "Constant hunger is a willpower problem.", hi: "Baar-baar bhookh lagna willpower ki kami hai." },
      title: { en: "Myth. <em>It's biology.</em>", hi: "Myth. <em>Yeh biology hai.</em>" },
      body: { en: "Appetite is steered by hormones, not character. After weight loss, the body switches on changes that push weight back up, and hunger is part of that. Medicines that act on the GLP-1 hormone pathway work partly by reducing appetite and slowing how fast the stomach empties.",
              hi: "Bhookh hormones se chalti hai, character se nahi. Weight kam hone ke baad body aise badlaav shuru karti hai jo weight wapas badhane ki taraf dhakelte hain, aur bhookh uska hissa hai. GLP-1 hormone pathway par kaam karne wali dawaiyan kuch had tak bhookh kam karke aur pet khaali hone ki raftaar dheemi karke kaam karti hain." } },
    diabetes: { kind: "swipe", answer: "myth", src: [SRC.annals],
      scene: { en: "Family function. A well-meaning aunty says:", hi: "Family function. Ek aunty pyaar se kehti hain:" },
      claim: { en: "These medicines are only for people with diabetes.", hi: "Yeh dawaiyan sirf diabetes walon ke liye hoti hain." },
      title: { en: "Myth. <em>Studies include people without it.</em>", hi: "Myth. <em>Studies mein bina diabetes wale bhi hain.</em>" },
      body: { en: "One review pooled 26 randomised trials covering 15,491 adults with overweight or obesity and without diabetes. Whether a medicine fits you is a doctor's call, made after your labs and your history.",
              hi: "Ek review mein 26 randomised trials ke 15,491 adults the, jinhe overweight ya obesity thi lekin diabetes nahi. Aapke liye theek hai ya nahi, yeh doctor tay karta hai, aapke labs aur history dekhkar." } },
    side: { kind: "swipe", answer: "fact", src: [SRC.annals, SRC.nausea],
      scene: { en: "A cousin's wedding. A friend of a friend 'had terrible side effects'.", hi: "Cousin ki shaadi. Kisi ke dost ko 'bahut side effects hue'." },
      claim: { en: "Most side effects people report are stomach-related.", hi: "Zyadatar side effects pet se jude hote hain." },
      title: { en: "Fact. <em>Mostly the gut.</em>", hi: "Fact. <em>Zyadatar pet ke.</em>" },
      body: { en: "Nausea, vomiting, diarrhoea and constipation were the most common. In trials they were mostly mild to moderate, and nausea showed up mainly early on, while doses were being stepped up. That is why screening and a doctor come before any medicine.",
              hi: "Sabse common the: nausea, ulti, dast aur kabz. Trials mein zyadatar halke se madhyam the, aur nausea mainly shuru mein dikhi, jab dose dheere-dheere badhaya ja raha tha. Isiliye kisi bhi dawai se pehle screening aur doctor zaroori hain." } },
    muscle: { kind: "swipe", answer: "myth", src: [SRC.dexa],
      scene: { en: "Gym trainer: 'You'll lose all your muscle.'", hi: "Gym trainer: 'Saara muscle chala jayega.'" },
      claim: { en: "Weight loss costs only fat, never muscle.", hi: "Weight loss mein sirf fat jata hai, muscle kabhi nahi." },
      title: { en: "Myth. <em>Some lean mass goes too.</em>", hi: "Myth. <em>Kuch lean mass bhi jaata hai.</em>" },
      body: { en: "In a 68-week scan substudy of 140 adults, fat mass fell about 19% and lean mass about 10%. Lean mass is not only muscle, but it is why protecting muscle belongs in the plan, and why a DEXA scan beats the weighing scale.",
              hi: "68 hafte ke scan substudy mein, 140 adults mein fat mass lagbhag 19% aur lean mass lagbhag 10% kam hua. Lean mass sirf muscle nahi hota, lekin isiliye plan mein muscle bachana zaroori hai, aur isiliye DEXA scan, weighing scale se zyada batata hai." } },
    regain: { kind: "slider", truth: 67, src: [SRC.ext],
      scene: { en: "Diwali, one year on. Everything has stopped.", hi: "Ek saal baad Diwali. Sab kuch band ho chuka hai." },
      claim: { en: "After the medicine and the lifestyle support both stop, how much of the lost weight comes back within a year?", hi: "Dawai aur lifestyle support dono band hone par, ek saal mein ghataya hua kitna weight wapas aata hai?" },
      title: { en: "About two-thirds. <em>Biology, not failure.</em>", hi: "Lagbhag do-tihai. <em>Biology hai, haar nahi.</em>" },
      body: { en: "A year after both stopped, trial participants had on average regained about two-thirds of the weight they had lost, and health markers drifted back too. It is not a personal failing. It is why a plan for what comes after matters from day one.",
              hi: "Dono band hone ke ek saal baad, trial ke participants ne average mein ghataye hue weight ka lagbhag do-tihai hissa wapas pa liya, aur health markers bhi pehle jaise hone lage. Yeh personal kamzori nahi hai. Isiliye pehle din se 'baad ka plan' zaroori hai." } },
    numbers: { kind: "tool", src: [SRC.sa],
      scene: { en: "The scale says 24. The doctor says: check your waist.", hi: "Scale kehta hai 24. Doctor kehta hai: kamar naapo." },
      claim: { en: "Indian adults can carry more body fat than their BMI suggests.", hi: "Bhartiya adults mein BMI se zyada body fat ho sakta hai." },
      body: { en: "Fact. South Asians tend to carry more body fat at the same BMI and develop health risks at lower BMI. Asian Indian guidance flags BMI 23 and above as overweight, and a waist of 90 cm or more in men, 80 cm or more in women.",
              hi: "Fact. South Asians mein same BMI par body fat zyada hota hai aur health risk kam BMI par hi shuru ho jaate hain. Asian Indian guidance BMI 23 se upar ko overweight, aur kamar 90 cm (purush) ya 80 cm (mahila) se upar ko flag karti hai." } }
  };

  var DOUBTS = {
    safe:     { round: "side",     label: { en: "Is it safe?", hi: "Safe hai?" },
      matters: { en: "Safety starts before any medicine: screening, blood tests and a doctor who reviews your history. The common side effects are mostly stomach-related and often appear early.", hi: "Safety kisi bhi dawai se pehle shuru hoti hai: screening, blood tests aur ek doctor jo aapki history dekhe. Common side effects zyadatar pet se jude hote hain aur aksar shuru mein dikhte hain." },
      ask: { en: "Which tests come first, and what should I report straight away?", hi: "Pehle kaun se tests honge, aur kya turant batana chahiye?" },
      arch: { en: "The Safety-First", hi: "The Safety-First" }, line: { en: "Reads the fine print so everyone else doesn't have to.", hi: "Fine print khud padhte hain." } },
    muscle:   { round: "muscle",   label: { en: "Will I lose muscle?", hi: "Muscle ghatega?" },
      matters: { en: "Some lean mass goes with any weight loss. A body-composition scan shows what is really changing, and protecting muscle sits alongside the plan.", hi: "Weight kam hone par kuch lean mass jaata hai. Body-composition scan dikhata hai asal mein kya badal raha hai, aur muscle bachana plan ka hissa hai." },
      ask: { en: "Can I get a DEXA scan first, and what is the plan for strength and protein?", hi: "Kya pehle DEXA scan ho sakta hai, aur strength aur protein ka plan kya hai?" },
      arch: { en: "The Muscle Guardian", hi: "The Muscle Guardian" }, line: { en: "Cares about strength as much as the scale.", hi: "Scale jitni hi strength ki parwah." } },
    regain:   { round: "regain",   label: { en: "Will it come back?", hi: "Wapas aa jayega?" },
      matters: { en: "Regain is biology, not failure, and trial data shows it is common once treatment stops. So the useful question is what happens after.", hi: "Wapas aana biology hai, haar nahi, aur trial data kehta hai ki treatment band hone par yeh aam hai. Isliye kaam ka sawal hai: uske baad kya hoga?" },
      ask: { en: "What is my maintenance plan, and how is the exit planned?", hi: "Mera maintenance plan kya hai, aur exit kaise plan hota hai?" },
      arch: { en: "The Long-Gamer", hi: "The Long-Gamer" }, line: { en: "Thinks past the first few months.", hi: "Pehle kuch mahino se aage sochte hain." } },
    diabetic: { round: "diabetes", label: { en: "Only for diabetics?", hi: "Sirf diabetes walon ke liye?" },
      matters: { en: "Large trials enrolled adults without diabetes. Whether it fits you is a doctor's decision after your labs and history.", hi: "Bade trials mein bina diabetes wale adults the. Aapke liye theek hai ya nahi, yeh labs aur history ke baad doctor ka faisla hai." },
      ask: { en: "What do my labs say about how my body handles sugar?", hi: "Mere labs batate hain meri body sugar ko kaise sambhalti hai?" },

    function tint(d) { c.style.setProperty("--l", Math.min(1, Math.max(0, -d / 90))); c.style.setProperty("--r", Math.min(1, Math.max(0, d / 90))); }
    c.addEventListener("pointerdown", function (e) { drag = true; sx = e.clientX; try { c.setPointerCapture(e.pointerId); } catch (x) {} c.style.transition = "none"; c.style.cursor = "grabbing"; });
    c.addEventListener("pointermove", function (e) { if (!drag) return; dx = e.clientX - sx; c.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 20) + "deg)"; tint(dx); });
    function end() {
      if (!drag) return; drag = false; c.style.transition = ""; c.style.cursor = "";
      if (Math.abs(dx) > 90) decide(dx < 0 ? "myth" : "fact");
      else { c.style.transform = ""; tint(0); }
      dx = 0;
    }
    c.addEventListener("pointerup", end);
    c.addEventListener("pointercancel", end);
  }

  function decide(dir) {
    if (S.busy) return; S.busy = true;
    var id = rid(), c = $("swipe");
    if (c) { c.style.transition = "transform .25s ease, opacity .25s ease"; c.style.transform = "translateX(" + (dir === "myth" ? -130 : 130) + "%) rotate(" + (dir === "myth" ? -14 : 14) + "deg)"; c.style.opacity = "0"; }
    S.picks[id] = dir;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    setTimeout(function () { S.revealed = true; render(); window.scrollTo(0, 0); }, 230);
  }

  function advance() {
    S.done = Math.min(TOTAL, S.done + 1);
    S.revealed = false;
    if (S.r === 0) { S.mode = "doubts"; }
    else if (S.r >= TOTAL - 1) { S.mode = "result"; }
    else { S.r += 1; }
    render(); window.scrollTo(0, 0);
  }

  function buildOrder() {
    var first = S.doubts.map(function (k) { return DOUBTS[k].round; });
    var rest = ["diabetes", "side", "numbers", "muscle", "regain"].filter(function (id) { return first.indexOf(id) < 0; });
    S.order = ["hunger"].concat(first, rest);
  }

  function numCheck() {
    var n = S.num, out = [];
    var w = parseFloat(n.waist), h = parseFloat(n.h), kg = parseFloat(n.w);
    if (!n.sex || !(w >= 40 && w <= 200)) { n.res = [u("needSex")]; return; }
    var th = n.sex === "m" ? 90 : 80;
    out.push(u(w >= th ? "waistHi" : "waistLo").replace("{w}", w).replace("{t}", th));
    if (h >= 120 && h <= 220 && kg >= 30 && kg <= 250) {
      var b = kg / Math.pow(h / 100, 2), bs = b.toFixed(1);
      out.push(u(b < 23 ? "bmiLo" : (b < 25 ? "bmiMid" : "bmiHi")).replace("{b}", bs));
    }
    n.res = out;
  }

  /* ---------- lead + sharing ---------- */
  function setToast(msg, ok) { S.lead.msg = msg; S.lead.state = ok ? "saved" : S.lead.state; var el = $("toast"); if (el) { el.textContent = msg; el.className = "toast" + (ok ? " ok" : ""); } }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); done(ok);
    }
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, fallback); } catch (e) { fallback(); }
  }

  function submitLead() {
    var name = $("lname").value.trim(), digits = $("lphone").value.replace(/\D/g, ""), ok = $("lconsent").checked;
    S.lead.name = name; S.lead.phone = $("lphone").value;
    if (digits.length === 12 && digits.indexOf("91") === 0) digits = digits.slice(2);
    if (!name || !/^[6-9]\d{9}$/.test(digits) || !ok) { setToast(u("bad"), false); return; }
    var payload = { name: name, phone: digits, consent: true, lang: S.lang, score: score(), fourpm: S.fourpm, doubts: S.doubts, missed: missed(), archetype: arch().arch.en, at: new Date().toISOString() };
    if (!DB || !UID) { setToast(u("failed"), false); return; }
    DB.doc("leads/" + UID).set(payload).then(function () { setToast(u("saved"), true); render(); }, function () { setToast(u("failed"), false); });
  }

  /* ---------- events ---------- */
  var app = $("app");
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button, a"); if (!b) return;
    var d = b.dataset;
    if (d.act === "lang") { S.lang = S.lang === "en" ? "hi" : "en"; render(); }
    else if (d["4pm"]) { S.fourpm = d["4pm"]; S.mode = "round"; S.r = 0; render(); window.scrollTo(0, 0); }
    else if (d.pick) { decide(d.pick); }
    else if (d.act === "lock") { S.picks[rid()] = S.guess; S.revealed = true; render(); window.scrollTo(0, 0); }
    else if (d.act === "next") { advance(); }
    else if (d.doubt) {
      var k = d.doubt, i = S.doubts.indexOf(k);
      if (i > -1) S.doubts.splice(i, 1); else { if (S.doubts.length >= 2) S.doubts.shift(); S.doubts.push(k); }
      render();
    }
    else if (d.act === "doubts-go") { buildOrder(); S.mode = "round"; S.r = 1; S.revealed = false; render(); window.scrollTo(0, 0); }
    else if (d.sex) { S.num.sex = d.sex; S.num.res = null; render(); }
    else if (d.act === "check") { numCheck(); render(); }
    else if (d.act === "lead") { submitLead(); }
    else if (d.act === "copy-summary") { copyText(summaryText(), function (ok) { setToast(ok ? u("copied") : summaryText(), false); }); }
    else if (d.act === "copylink") { copyText(location.href, function (ok) { var m = $("sharemsg"); if (m) m.textContent = ok ? u("copied") : location.href; }); }
    else if (d.act === "restart") {
      var lang = S.lang;
      S = { lang: lang, mode: "hook", r: 0, order: ["hunger"], picks: {}, revealed: false, done: 0, fourpm: "", doubts: [], busy: false, guess: 50, num: { sex: "", waist: "", h: "", w: "", res: null }, lead: { name: "", phone: "", state: "", msg: "" } };
      render(); window.scrollTo(0, 0);
    }
  });
  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "guess") { S.guess = parseInt(el.value, 10); var g = $("gv"); if (g) g.textContent = S.guess + "%"; }
    else if (el.id === "waist") { S.num.waist = el.value; }
    else if (el.id === "hgt") { S.num.h = el.value; }
    else if (el.id === "wgt") { S.num.w = el.value; }
  });

  /* ---------- optional capabilities (lead save). The page works fully without them. ---------- */
  try {
    if (window.claude && window.claude.use) {
      window.claude.use("db").then(function (d) { DB = d; }, function () {});
      window.claude.use("user").then(function (us) { if (us && us.id) us.id().then(function (i) { UID = i; }, function () {}); }, function () {});
    }
  } catch (e) {}

  render();
})();
</script>
